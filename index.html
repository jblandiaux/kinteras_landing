<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Kinteras — Your Run Becomes an RPG</title>
    <meta
      name="description"
      content="Run in the real world, level your creatures, discover encounters and fight your way through the world of Kinteras. Join the Early Access."
    />
    <link rel="canonical" href="https://kinteras.app/" />
    <meta name="theme-color" content="#0c1230" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Inter carries the headline, so it is on the critical path; MedievalSharp
         only styles section titles further down and can arrive with the rest. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/inter-latin.woff2"
      crossorigin
    />
    <!-- The poster is what fills the video frame before the clip is fetched, and
         under reduced motion it is the only thing that ever fills it. -->
    <link rel="preload" as="image" href="/video/poster.webp" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kinteras" />
    <meta property="og:url" content="https://kinteras.app/" />
    <meta property="og:title" content="Kinteras — Your Run Becomes an RPG" />
    <meta
      property="og:description"
      content="Run in the real world, level your creatures, discover encounters and fight your way through the world of Kinteras."
    />
    <meta property="og:image" content="https://kinteras.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Kinteras — your run becomes an RPG" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kinteras — Your Run Becomes an RPG" />
    <meta
      name="twitter:description"
      content="Run in the real world, level your creatures, discover encounters and fight your way through the world of Kinteras."
    />
    <meta name="twitter:image" content="https://kinteras.app/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
